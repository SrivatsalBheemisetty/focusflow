<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Productivity Hub</title>
    <!-- Tailwind CSS for sleek modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for clean visual cues -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Smooth iOS style scrolling and font optimization */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex justify-center">

    <!-- App Container (Constrained to looking like a premium mobile interface) -->
    <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative border-x border-slate-100">
        
        <!-- Header -->
        <header class="sticky top-0 bg-white/80 backdrop-blur-md px-6 pt-6 pb-4 border-b border-slate-100 z-10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                    <i data-lucide="layers" class="text-indigo-600 w-6 h-6"></i> FocusFlow
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">Capture. Schedule. Execute.</p>
            </div>
            <button onclick="toggleStats()" class="p-2 hover:bg-slate-100 rounded-full transition-colors relative">
                <i data-lucide="bar-chart-2" class="text-slate-600 w-5 h-5"></i>
            </button>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar pb-32">
            
            <!-- Quick Stats Panel (Collapsible) -->
            <div id="statsPanel" class="bg-indigo-900 text-white rounded-2xl p-4 hidden shadow-lg transition-all duration-300">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-semibold opacity-80">Productivity Snapshot</h3>
                    <i data-lucide="activity" class="w-4 h-4 text-indigo-300"></i>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-white/10 p-2 rounded-xl">
                        <span id="statTotal" class="block text-xl font-bold">0</span>
                        <span class="text-[10px] opacity-60 uppercase">Captured</span>
                    </div>
                    <div class="bg-white/10 p-2 rounded-xl">
                        <span id="statPending" class="block text-xl font-bold text-amber-300">0</span>
                        <span class="text-[10px] opacity-60 uppercase">Pending</span>
                    </div>
                    <div class="bg-white/10 p-2 rounded-xl">
                        <span id="statDone" class="block text-xl font-bold text-emerald-400">0</span>
                        <span class="text-[10px] opacity-60 uppercase">Cleared</span>
                    </div>
                </div>
            </div>

            <!-- Thoughts Quick Input Form -->
            <section class="bg-slate-900 text-white rounded-2xl p-5 shadow-xl">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Instant Capture</label>
                <div class="relative mb-3">
                    <textarea id="thoughtInput" rows="2" class="w-full bg-slate-800 text-white placeholder-slate-500 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" placeholder="What's on your mind right now?"></textarea>
                    <button onclick="addThought()" class="absolute right-2 bottom-3 bg-indigo-600 hover:bg-indigo-500 p-2 rounded-lg transition-all shadow-md active:scale-95">
                        <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Horizontal Category Picker -->
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Activity Context</label>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="categoryContainer">
                    <button onclick="selectCategory('Ops')" id="cat-Ops" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-600 text-white border border-transparent transition-all">
                        <i data-lucide="building-2" class="w-3.5 h-3.5"></i> Operations
                    </button>
                    <button onclick="selectCategory('Strategy')" id="cat-Strategy" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 transition-all">
                        <i data-lucide="trending-up" class="w-3.5 h-3.5"></i> Strategy
                    </button>
                    <button onclick="selectCategory('Brainstorm')" id="cat-Brainstorm" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 transition-all">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i> Brainstorm
                    </button>
                    <button onclick="selectCategory('Admin')" id="cat-Admin" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 transition-all">
                        <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Personal
                    </button>
                </div>
            </section>

            <!-- Filter Tabs -->
            <div class="flex border-b border-slate-100 text-sm font-medium">
                <button onclick="switchTab('all')" id="tab-all" class="flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold transition-all">Inbox</button>
                <button onclick="switchTab('scheduled')" id="tab-scheduled" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 transition-all">Scheduled</button>
                <button onclick="switchTab('completed')" id="tab-completed" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 transition-all">Cleared</button>
            </div>

            <!-- Dynamic Thought Stream List -->
            <section id="thoughtStream" class="space-y-3">
                <!-- JavaScript handles population here -->
            </section>

        </main>

        <!-- Interactive Global Scheduling Sheet (Slide Up Modal) -->
        <div id="scheduleSheet" class="fixed inset-x-0 bottom-0 bg-white rounded-t-3xl border-t border-slate-200 p-6 shadow-2xl transform translate-y-full transition-transform duration-300 z-30 max-w-md mx-auto">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-5"></div>
            <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i data-lucide="calendar" class="text-indigo-600 w-5 h-5"></i> Convert Thought to Action
            </h3>
            <input type="hidden" id="schedulingThoughtId">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Set Execution Date & Time</label>
                    <input type="datetime-local" id="reminderTime" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeScheduleSheet()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium py-3 rounded-xl transition-colors">Cancel</button>
                    <button onclick="confirmSchedule()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-3 rounded-xl transition-colors shadow-lg shadow-indigo-600/20">Set Dynamic Reminder</button>
                </div>
            </div>
        </div>

        <!-- Dim Background Overlay for Sheet -->
        <div id="overlay" onclick="closeScheduleSheet()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden z-20"></div>

    </div>

    <!-- Core App Logic Script -->
    <script>
        let thoughts = JSON.parse(localStorage.getItem('focus_thoughts')) || [];
        let selectedCategory = 'Ops';
        let currentTab = 'all';

        const config = {
            Ops: { label: 'Operations', color: 'bg-blue-50 text-blue-700 border-blue-100', icon: 'building-2' },
            Strategy: { label: 'Strategy', color: 'bg-purple-50 text-purple-700 border-purple-100', icon: 'trending-up' },
            Brainstorm: { label: 'Brainstorm', color: 'bg-amber-50 text-amber-700 border-amber-100', icon: 'lightbulb' },
            Admin: { label: 'Personal', color: 'bg-emerald-50 text-emerald-700 border-emerald-100', icon: 'check-square' }
        };

        function initApp() {
            lucide.createIcons();
            renderThoughts();
            updateStats();
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 transition-all";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            activeBtn.className = "cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-600 text-white border border-transparent transition-all";
        }

        function addThought() {
            const input = document.getElementById('thoughtInput');
            if (!input.value.trim()) return;

            const newThought = {
                id: Date.now(),
                text: input.value.trim(),
                category: selectedCategory,
                timestamp: new Date().toISOString(),
                reminder: null,
                completed: false
            };

            thoughts.unshift(newThought);
            saveData();
            input.value = '';
            renderThoughts();
            updateStats();
        }

        function renderThoughts() {
            const container = document.getElementById('thoughtStream');
            container.innerHTML = '';

            let filtered = thoughts;
            if (currentTab === 'scheduled') filtered = thoughts.filter(t => t.reminder && !t.completed);
            if (currentTab === 'completed') filtered = thoughts.filter(t => t.completed);
            if (currentTab === 'all') filtered = thoughts.filter(t => !t.completed);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 px-4 border-2 border-dashed border-slate-100 rounded-2xl">
                        <i data-lucide="inbox" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
                        <p class="text-sm text-slate-400">Your workspace is clear. Capture an idea above.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(t => {
                const catInfo = config[t.category] || config.Ops;
                const dateStr = new Date(t.timestamp).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                
                let reminderBadge = '';
                if (t.reminder) {
                    const remDate = new Date(t.reminder).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                    reminderBadge = `
                        <div class="mt-2 inline-flex items-center gap-1 text-[11px] font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
                            <i data-lucide="bell" class="w-3 h-3"></i> Remind: ${remDate}
                        </div>`;
                }

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border border-slate-100 transition-all duration-200 bg-white shadow-xs hover:shadow-md ${t.completed ? 'opacity-60' : ''}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3">
                        <div class="flex-1">
                            <span class="inline-flex items-center gap-1 text-[10px] font-semibold uppercase px-2.5 py-0.5 rounded-full border ${catInfo.color}">
                                <i data-lucide="${catInfo.icon}" class="w-2.5 h-2.5"></i> ${catInfo.label}
                            </span>
                            <p class="text-sm mt-2 text-slate-800 font-normal leading-relaxed ${t.completed ? 'line-through' : ''}">${t.text}</p>
                            <span class="block text-[10px] text-slate-400 mt-2">${dateStr}</span>
                            ${reminderBadge}
                        </div>
                        <div class="flex flex-col gap-1">
                            ${!t.completed ? `
                                <button onclick="openScheduleSheet(${t.id})" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="Schedule">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                </button>
                                <button onclick="toggleComplete(${t.id})" class="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors" title="Complete">
                                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                                </button>
                            ` : `
                                <button onclick="toggleComplete(${t.id})" class="p-2 text-emerald-600 bg-emerald-50 rounded-lg transition-colors" title="Reopen">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                </button>
                            `}
                            <button onclick="deleteThought(${t.id})" class="p-2 text-slate-300 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Delete">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 transition-all";
            });
            document.getElementById(`tab-${tab}`).className = "flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold transition-all";
            renderThoughts();
        }

        function toggleComplete(id) {
            const index = thoughts.findIndex(t => t.id === id);
            if (index !== -1) {
                thoughts[index].completed = !thoughts[index].completed;
                saveData();
                renderThoughts();
                updateStats();
            }
        }

        function deleteThought(id) {
            if(confirm("Permanently clear this thought from your system?")) {
                thoughts = thoughts.filter(t => t.id !== id);
                saveData();
                renderThoughts();
                updateStats();
            }
        }

        function openScheduleSheet(id) {
            document.getElementById('schedulingThoughtId').value = id;
            document.getElementById('scheduleSheet').classList.remove('translate-y-full');
            document.getElementById('overlay').classList.remove('hidden');
        }

        function closeScheduleSheet() {
            document.getElementById('scheduleSheet').classList.add('translate-y-full');
            document.getElementById('overlay').classList.add('hidden');
        }

        function confirmSchedule() {
            const id = parseInt(document.getElementById('schedulingThoughtId').value);
            const timeVal = document.getElementById('reminderTime').value;
            
            if (!timeVal) {
                alert("Please select a target execution time.");
                return;
            }

            const index = thoughts.findIndex(t => t.id === id);
            if (index !== -1) {
                thoughts[index].reminder = timeVal;
                saveData();
                closeScheduleSheet();
                renderThoughts();
                updateStats();
                
                // Simulate an in-app system notification trigger
                const taskTime = new Date(timeVal).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                alert(`Productivity Block set for ${taskTime}. FocusFlow will alert you.`);
            }
        }

        function toggleStats() {
            const panel = document.getElementById('statsPanel');
            panel.classList.toggle('hidden');
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = thoughts.length;
            document.getElementById('statPending').innerText = thoughts.filter(t => !t.completed).length;
            document.getElementById('statDone').innerText = thoughts.filter(t => t.completed).length;
        }

        function saveData() {
            localStorage.setItem('focus_thoughts', JSON.stringify(thoughts));
        }

        // Initialize App on Page Load
        window.onload = initApp;
    </script>
</body>
</html>
