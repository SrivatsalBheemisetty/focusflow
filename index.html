<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex justify-center">

    <script>
        // 🛑 PASTE YOUR SUPABASE CREDS HERE TO SYNC DEVICES
        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL_HERE";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
        
        const supabase = EXPORTS.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative border-x border-slate-100">
        
        <header class="sticky top-0 bg-white/80 backdrop-blur-md px-6 pt-6 pb-4 border-b border-slate-100 z-10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                    <i data-lucide="layers" class="text-indigo-600 w-6 h-6"></i> FocusFlow <span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">Cloud Live</span>
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">Real-time Cross-Device Sync</p>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar pb-32">
            
            <section class="bg-slate-900 text-white rounded-2xl p-5 shadow-xl">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Instant Capture</label>
                <div class="relative mb-3">
                    <textarea id="thoughtInput" rows="2" class="w-full bg-slate-800 text-white placeholder-slate-500 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" placeholder="What's on your mind?"></textarea>
                    <button onclick="addThought()" class="absolute right-2 bottom-3 bg-indigo-600 hover:bg-indigo-500 p-2 rounded-lg transition-all shadow-md">
                        <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="categoryContainer">
                    <button onclick="selectCategory('Ops')" id="cat-Ops" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-600 text-white transition-all">Operations</button>
                    <button onclick="selectCategory('Strategy')" id="cat-Strategy" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 transition-all">Strategy</button>
                    <button onclick="selectCategory('Brainstorm')" id="cat-Brainstorm" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 transition-all">Brainstorm</button>
                    <button onclick="selectCategory('Admin')" id="cat-Admin" class="cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 transition-all">Personal</button>
                </div>
            </section>

            <div class="flex border-b border-slate-100 text-sm font-medium">
                <button onclick="switchTab('all')" id="tab-all" class="flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold">Inbox</button>
                <button onclick="switchTab('scheduled')" id="tab-scheduled" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400">Scheduled</button>
                <button onclick="switchTab('completed')" id="tab-completed" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400">Cleared</button>
            </div>

            <section id="thoughtStream" class="space-y-3">
                <div class="text-center py-6 text-slate-400 text-sm">Fetching cloud data...</div>
            </section>
        </main>

        <div id="scheduleSheet" class="fixed inset-x-0 bottom-0 bg-white rounded-t-3xl border-t border-slate-200 p-6 shadow-2xl transform translate-y-full transition-transform duration-300 z-30 max-w-md mx-auto">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-5"></div>
            <h3 class="text-base font-bold text-slate-900 mb-4">Schedule Execution</h3>
            <input type="hidden" id="schedulingThoughtId">
            <div class="space-y-4">
                <input type="datetime-local" id="reminderTime" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm">
                <div class="flex gap-3">
                    <button onclick="closeScheduleSheet()" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl">Cancel</button>
                    <button onclick="confirmSchedule()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl">Set Reminder</button>
                </div>
            </div>
        </div>
        <div id="overlay" onclick="closeScheduleSheet()" class="fixed inset-0 bg-slate-900/40 hidden z-20"></div>
    </div>

    <script>
        let thoughts = [];
        let selectedCategory = 'Ops';
        let currentTab = 'all';

        const config = {
            Ops: { label: 'Operations', color: 'bg-blue-50 text-blue-700 border-blue-100' },
            Strategy: { label: 'Strategy', color: 'bg-purple-50 text-purple-700 border-purple-100' },
            Brainstorm: { label: 'Brainstorm', color: 'bg-amber-50 text-amber-700 border-amber-100' },
            Admin: { label: 'Personal', color: 'bg-emerald-50 text-emerald-700 border-emerald-100' }
        };

        async function fetchThoughts() {
            let { data, error } = await supabase.from('focus_thoughts').select('*').order('id', { ascending: false });
            if (!error) {
                thoughts = data;
                renderThoughts();
            }
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.className = "cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 transition-all");
            document.getElementById(`cat-${cat}`).className = "cat-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-indigo-600 text-white transition-all";
        }

        async function addThought() {
            const input = document.getElementById('thoughtInput');
            if (!input.value.trim()) return;

            const newThought = {
                id: Date.now(),
                text: input.value.trim(),
                category: selectedCategory,
                timestamp: new Date().toISOString(),
                reminder: null,
                completed: false
            };

            const { error } = await supabase.from('focus_thoughts').insert([newThought]);
            if (!error) {
                input.value = '';
                fetchThoughts();
            }
        }

        function renderThoughts() {
            const container = document.getElementById('thoughtStream');
            container.innerHTML = '';

            let filtered = thoughts;
            if (currentTab === 'scheduled') filtered = thoughts.filter(t => t.reminder && !t.completed);
            if (currentTab === 'completed') filtered = thoughts.filter(t => t.completed);
            if (currentTab === 'all') filtered = thoughts.filter(t => !t.completed);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center py-12 text-sm text-slate-400">All clear.</p>`;
                return;
            }

            filtered.forEach(t => {
                const catInfo = config[t.category] || config.Ops;
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border border-slate-100 bg-white ${t.completed ? 'opacity-60' : ''}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3">
                        <div class="flex-1">
                            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded border ${catInfo.color}">${catInfo.label}</span>
                            <p class="text-sm mt-2 text-slate-800 ${t.completed ? 'line-through' : ''}">${t.text}</p>
                            ${t.reminder ? `<div class="mt-2 text-[11px] text-indigo-600 font-medium">⏰ Scheduled: ${new Date(t.reminder).toLocaleString()}</div>` : ''}
                        </div>
                        <div class="flex gap-1">
                            <button onclick="openScheduleSheet(${t.id})" class="p-1 text-slate-400 hover:text-indigo-600"><i data-lucide="calendar" class="w-4 h-4"></i></button>
                            <button onclick="toggleComplete(${t.id}, ${t.completed})" class="p-1 text-slate-400 hover:text-emerald-600"><i data-lucide="check-circle" class="w-4 h-4"></i></button>
                            <button onclick="deleteThought(${t.id})" class="p-1 text-slate-300 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400");
            document.getElementById(`tab-${tab}`).className = "flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold";
            renderThoughts();
        }

        async function toggleComplete(id, currentStatus) {
            await supabase.from('focus_thoughts').update({ completed: !currentStatus }).eq('id', id);
            fetchThoughts();
        }

        async function deleteThought(id) {
            if(confirm("Delete this thought?")) {
                await supabase.from('focus_thoughts').delete().eq('id', id);
                fetchThoughts();
            }
        }

        function openScheduleSheet(id) {
            document.getElementById('schedulingThoughtId').value = id;
            document.getElementById('scheduleSheet').classList.remove('translate-y-full');
            document.getElementById('overlay').classList.remove('hidden');
        }

        function closeScheduleSheet() {
            document.getElementById('scheduleSheet').classList.add('translate-y-full');
            document.getElementById('overlay').classList.add('hidden');
        }

        async function confirmSchedule() {
            const id = document.getElementById('schedulingThoughtId').value;
            const timeVal = document.getElementById('reminderTime').value;
            if (!timeVal) return;

            await supabase.from('focus_thoughts').update({ reminder: timeVal }).eq('id', id);
            closeScheduleSheet();
            fetchThoughts();
        }

        window.onload = () => { lucide.createIcons(); fetchThoughts(); };
    </script>
</body>
</html>
